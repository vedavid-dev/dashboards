version: 1
id: quotation-service
title: Quotation service internals
sections:
  - title: Cache
    elements:
      - type: stat
        title: Hit rate
        query: 100 * sum(rate(cache_requests_total{namespace="workload", job="kubernetes-pods", result="hit"}[5m])) / sum(rate(cache_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: percent
        decimals: 0
      - type: stat
        title: Redis p95
        query: histogram_quantile(0.95, sum by (le) (rate(cache_request_duration_seconds_bucket{namespace="workload", job="kubernetes-pods", op="get"}[5m]))) * 1000
        unit: milliseconds
      - type: line
        title: Lookups by result
        query: sum by (result) (rate(cache_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: ops_per_sec
        stack: true
        series:
          label: "{{result}}"
  - title: Connection pool
    elements:
      - type: stat
        title: Checkout p95
        description: Time to get a pooled Postgres connection, including a TLS handshake when the pool opens one.
        query: histogram_quantile(0.95, sum by (le) (rate(postgres_checkout_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000
        unit: milliseconds
        thresholds:
          direction: above
          steps:
            - { at: 50, level: warning }
            - { at: 200, level: critical }
      - type: stat
        title: Query p95
        query: histogram_quantile(0.95, sum by (le) (rate(postgres_query_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000
        unit: milliseconds
      - type: line
        title: Checkout against query
        query: label_replace(histogram_quantile(0.95, sum by (le) (rate(postgres_checkout_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "step", "checkout", "", "") or label_replace(histogram_quantile(0.95, sum by (le) (rate(postgres_query_duration_seconds_bucket{namespace="workload", job="kubernetes-pods"}[5m]))) * 1000, "step", "query", "", "")
        unit: milliseconds
        series:
          label: "{{step}}"
      - type: line
        title: Requests by outcome
        query: sum by (code) (rate(grpc_requests_total{namespace="workload", job="kubernetes-pods"}[5m]))
        unit: requests_per_sec
        stack: true
        series:
          label: "{{code}}"
  - title: Process
    elements:
      - type: line
        title: Memory by pod
        query: process_resident_memory_bytes{namespace="workload", job="kubernetes-pods", app="quotationservice"}
        unit: bytes
        series:
          label: "{{pod}}"
      - type: line
        title: CPU by pod
        query: rate(process_cpu_seconds_total{namespace="workload", job="kubernetes-pods", app="quotationservice"}[5m])
        unit: cores
        series:
          label: "{{pod}}"
      - type: list
        title: Open file descriptors
        query: process_open_fds{namespace="workload", job="kubernetes-pods", app="quotationservice"}
        unit: count
        label: "{{pod}}"
        limit: 5
